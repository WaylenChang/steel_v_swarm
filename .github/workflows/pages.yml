name: Play on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Godot and Web templates
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $editor = "Godot_v$env:GODOT_VERSION-stable_win64"
          Invoke-WebRequest "$release/$editor.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          "$env:RUNNER_TEMP/godot" >> $env:GITHUB_PATH
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          $templateRoot = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateRoot | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.Name -in @('web_nothreads_release.zip', 'web_nothreads_debug.zip', 'version.txt')) {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$templateRoot/$($entry.Name)", $true)
              }
            }
          } finally { $archive.Dispose() }
      - name: Validate native game and export single-player Web build
        shell: pwsh
        run: ./tools/export_web.ps1 -Godot "Godot_v${env:GODOT_VERSION}-stable_win64_console.exe"
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Run exported game in Chromium
        run: python tools/test_web.py build/web
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-validation-logs
          path: |
            build/logs/
            tests/*-client*.log
            tests/*-server*.log
          if-no-files-found: ignore
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: build/web/
          include-hidden-files: true
      - name: Package Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
